apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM= # base64 encoded "postgres"
  POSTGRES_PASSWORD: cGFzc3dvcmQ= # base64 encoded "password"
  POSTGRES_DB: Z3JhZGV3aXNl # base64 encoded "gradewise"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init.sql: |
    -- Create databases
    CREATE DATABASE gradewise_api;
    CREATE DATABASE temporal;
    CREATE DATABASE temporal_visibility;

    -- Create users with appropriate permissions
    CREATE USER gradewise_user WITH PASSWORD 'gradewise_pass';
    CREATE USER temporal_user WITH PASSWORD 'temporal_pass' CREATEDB;

    -- Grant permissions
    GRANT ALL PRIVILEGES ON DATABASE gradewise_api TO gradewise_user;
    GRANT ALL PRIVILEGES ON DATABASE temporal TO temporal_user;
    GRANT ALL PRIVILEGES ON DATABASE temporal_visibility TO temporal_user;

    -- Connect to gradewise_api and create sample table for testing
    \c gradewise_api;
    CREATE TABLE IF NOT EXISTS health_check (
        id SERIAL PRIMARY KEY,
        status VARCHAR(20) NOT NULL,
        checked_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO health_check (status) VALUES ('initialized');

    -- Grant permissions to gradewise_user
    GRANT ALL PRIVILEGES ON TABLE health_check TO gradewise_user;
    GRANT ALL PRIVILEGES ON SEQUENCE health_check_id_seq TO gradewise_user;

    -- Grant schema permissions for temporal databases
    \c temporal;
    GRANT ALL PRIVILEGES ON SCHEMA public TO temporal_user;
    \c temporal_visibility;
    GRANT ALL PRIVILEGES ON SCHEMA public TO temporal_user;
    
    \c gradewise_api;
    -- UUID generator
    CREATE
    EXTENSION IF NOT EXISTS pgcrypto;

    -- ========== FACULTY (accounts) ==========
    CREATE TABLE IF NOT EXISTS faculty
    (
        id
        uuid
        PRIMARY
        KEY
        DEFAULT
        gen_random_uuid
    (
    ),
        email text NOT NULL UNIQUE,
        pass_hash text NOT NULL,
        full_name text NOT NULL,
        institution text,
        status text NOT NULL DEFAULT 'PENDING_VERIFICATION'
        CHECK
    (
        status
        IN
    (
        'PENDING_VERIFICATION',
        'VERIFIED'
    )),
        verified_at timestamptz,
        created_at timestamptz NOT NULL DEFAULT now
    (
    ),
        updated_at timestamptz NOT NULL DEFAULT now
    (
    )
        );

    -- verification codes for sign-up
    CREATE TABLE IF NOT EXISTS faculty_verifications
    (
        email
        text
        PRIMARY
        KEY
        REFERENCES
        faculty
    (
        email
    ) ON DELETE CASCADE,
        code text NOT NULL,
        expires_at timestamptz NOT NULL,
        created_at timestamptz NOT NULL DEFAULT now
    (
    )
        );

    -- ========== COURSES ==========
    CREATE TABLE IF NOT EXISTS courses
    (
        id
        uuid
        PRIMARY
        KEY
        DEFAULT
        gen_random_uuid
    (
    ),
        code text NOT NULL, -- e.g. "CS101"
        term text NOT NULL, -- e.g. "Fall 2025"
        title text NOT NULL,
        section text, -- nullable; some schools use it
        start_date date,
        end_date date,
        creator_faculty_id uuid NOT NULL REFERENCES faculty
    (
        id
    ) ON DELETE RESTRICT,
        created_at timestamptz NOT NULL DEFAULT now
    (
    ),
        updated_at timestamptz NOT NULL DEFAULT now
    (
    )
        );

    -- ========== GRADERS (TAs/graders per course) ==========
    DO
    $$
    BEGIN
    CREATE TYPE grader_role AS ENUM ('GRADER','TA');
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;

    CREATE TABLE IF NOT EXISTS course_graders
    (
        course_id
        uuid
        NOT
        NULL
        REFERENCES
        courses
    (
        id
    ) ON DELETE CASCADE,
        faculty_id uuid NOT NULL REFERENCES faculty
    (
        id
    )
      ON DELETE CASCADE,
        role grader_role NOT NULL DEFAULT 'GRADER',
        added_at timestamptz NOT NULL DEFAULT now
    (
    ),
        PRIMARY KEY
    (
        course_id,
        faculty_id
    )
        );

    -- ========== STUDENTS + ENROLLMENTS (roster) ==========
    CREATE TABLE IF NOT EXISTS students
    (
        id
        uuid
        PRIMARY
        KEY
        DEFAULT
        gen_random_uuid
    (
    ),
        email text NOT NULL UNIQUE,
        full_name text NOT NULL,
        created_at timestamptz NOT NULL DEFAULT now
    (
    )
        );

    CREATE TABLE IF NOT EXISTS enrollments
    (
        course_id
        uuid
        NOT
        NULL
        REFERENCES
        courses
    (
        id
    ) ON DELETE CASCADE,
        student_id uuid NOT NULL REFERENCES students
    (
        id
    )
      ON DELETE CASCADE,
        added_at timestamptz NOT NULL DEFAULT now
    (
    ),
        PRIMARY KEY
    (
        course_id,
        student_id
    )
        );

    -- ========== ROSTER UPLOAD JOBS (for CSV uploads) ==========
    CREATE TABLE IF NOT EXISTS roster_import_jobs
    (
        id
        uuid
        PRIMARY
        KEY
        DEFAULT
        gen_random_uuid
    (
    ),
        course_id uuid NOT NULL REFERENCES courses
    (
        id
    ) ON DELETE CASCADE,
        filename text NOT NULL,
        status text NOT NULL DEFAULT 'QUEUED'
        CHECK
    (
        status
        IN
    (
        'QUEUED',
        'PROCESSING',
        'DONE',
        'FAILED'
    )),
        has_header boolean NOT NULL DEFAULT true,
        created_at timestamptz NOT NULL DEFAULT now
    (
    ),
        updated_at timestamptz NOT NULL DEFAULT now
    (
    ),
        error text
        );

    -- Indexes
    CREATE INDEX IF NOT EXISTS courses_creator_idx ON courses(creator_faculty_id);
    CREATE INDEX IF NOT EXISTS graders_course_idx ON course_graders(course_id, faculty_id);
    CREATE INDEX IF NOT EXISTS enrollments_course_idx ON enrollments(course_id);

    -- App role privileges for everything in public schema
    GRANT
    USAGE
    ON
    SCHEMA
    public TO gradewise_user;
    GRANT
    SELECT,
    INSERT
    ,
    UPDATE,
    DELETE
    ON ALL TABLES IN SCHEMA public TO gradewise_user;
    GRANT
    USAGE,
    SELECT,
    UPDATE
    ON ALL SEQUENCES IN SCHEMA public TO gradewise_user;

    -- Ensure future objects created by *postgres* in public auto-grant to app
    ALTER
    DEFAULT PRIVILEGES FOR USER postgres IN SCHEMA public
      GRANT
    SELECT,
    INSERT
    ,
    UPDATE,
    DELETE
    ON TABLES TO gradewise_user;

    ALTER
    DEFAULT PRIVILEGES FOR USER postgres IN SCHEMA public
      GRANT USAGE,
    SELECT,
    UPDATE
    ON SEQUENCES TO gradewise_user;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-storage
        - name: postgres-init-script
          configMap:
            name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
