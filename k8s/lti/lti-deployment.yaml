apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradewise-lti
  labels: { app: gradewise-lti }
spec:
  replicas: 1
  selector: { matchLabels: { app: gradewise-lti } }
  template:
    metadata: { labels: { app: gradewise-lti } }
    spec:
      containers:
        - name: lti
          image: gradewise-lti:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gradewise-lti
  labels: { app: gradewise-lti }
spec:
  selector: { app: gradewise-lti }
  ports:
    - name: web
      port: 8080
      targetPort: http